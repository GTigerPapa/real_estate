# API 키 점검 (수동 실행, 또는 점검 스크립트가 바뀌어 push 될 때). 키 값은 출력하지 않고 각 API가 응답하는지만 확인한다.
name: 키 점검

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_keys.py"
      - ".github/workflows/check_keys.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 키 점검
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/check_keys.py
