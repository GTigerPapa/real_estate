# 매일 06:30 KST 아실 일별 매물 수 수집 + 모바일 웹앱 데이터(web/data/app.json) 갱신. (실거래는 Mac: scripts/mac_daily.py)
# 네이버 매물 덤프(data/listings/raw/)·아실 매물 목록(Mac launchd)이 push 될 때도 실행 → Cloudflare Pages가 커밋마다 자동 배포.
name: 데이터 갱신

on:
  schedule:
    - cron: "30 21 * * *"          # UTC 21:30 = KST 06:30
  push:
    branches: [main]
    paths:
      - "data/listings/raw/**"
      - "data/listings/asil/asil_offers.csv"   # Mac이 매일 올리는 아실 매물 목록 → 웹앱 데이터 재생성
      - "data/realestate.db"                   # Mac이 올리는 DB (매월·백필)
      - "config/**"
      - "src/realestate/**"
      - "scripts/export_web.py"
      - "scripts/ecos_collect.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -q requests PyYAML python-dotenv pandas
          pip install -q --no-deps -e .

      # 실거래(공공데이터포털)는 해외 IP 접속이 막혀 여기서 받지 않는다 (2026-09-29 확인: 모든 호출 ConnectTimeout).
      # 국내 Mac 이 매일 받아 web/data/app.json 을 커밋한다 (scripts/mac_daily.py). 아래 웹앱 데이터 생성은
      # 저장소의 DB가 더 오래됐으면 기존 app.json 의 실거래 부분을 그대로 둔다.

      - name: 아실 일별 매물 수 수집 (최근 3개월 재수집, 단지당 1회 요청)
        id: asil
        # 실패해도 나머지(실거래·웹앱 데이터) 커밋은 진행하고, 마지막 단계에서 작업을 실패로 표시해 알림을 받는다
        continue-on-error: true
        run: python scripts/asil_collect.py

      - name: 한국은행 ECOS 지표 (월별, 키 = ECOS_KEY)
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          if [ -z "$ECOS_KEY" ]; then echo "::warning::ECOS_KEY 시크릿이 없어 한국은행 지표를 건너뜁니다"; exit 0; fi
          python scripts/ecos_collect.py

      - name: 웹앱 데이터 생성
        run: python scripts/export_web.py

      - name: 커밋·push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/app.json data/listings/asil/ data/macro/
          # DB는 실거래를 받는 Mac 만 커밋한다 (scripts/mac_daily.py)
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

      - name: 아실 수집 실패 알림
        if: steps.asil.outcome == 'failure'
        run: |
          echo "::error::아실 매물 수 수집 실패 — 로그 확인 (응답 형식 변경·차단 가능성. 우회하지 말고 확인할 것)"
          exit 1
