# 수집 대상 시군구 (응답 sggCd로 확인)
lawd_codes:
  "11740": 서울 강동구
  "41133": 성남시 중원구
  "41450": 하남시
  "41135": 성남시 분당구

backfill_start: "202310"      # 백필 시작월 (YYYYMM)
refetch_recent_months: 3      # 현재월 포함 최근 N개월은 완료 여부와 무관하게 매번 재수집

api:
  num_of_rows: 1000
  request_interval_sec: 0.3   # 호출 간 최소 간격
  timeout_sec: 30
  max_retries: 4              # 지수 백오프: 1, 2, 4, 8초 (+지터)
  backoff_base_sec: 1.0

buy_cap_manwon: 140000        # 매수 상한 (만원) = 14억

# 평형 구간 (전용면적 ㎡, [min, max)). 확정: 2023-10~2026-09 관심 단지 실거래 분포 기준
#   59: 실제 59.71~59.99 / 74: 73.03~74.99 / 84: 84.04~84.99
# 84형 위 대형 (2026-09-29 추가, 실거래·전월세 면적 기준)
#   93: 미사더샵 93.06~93.36 / 101: 고덕자이 101.04·101.99, 고덕아이파크 102.85, 미사더샵 101.82, 장미8단지 101
#   118: 고덕자이 118.45 (고덕아이파크 120.37은 전월세만 있어 단지 평형에는 넣지 않음)
size_bands:
  - {band: "59", min: 57.0, max: 62.0}
  - {band: "74", min: 72.0, max: 77.0}
  - {band: "84", min: 82.0, max: 87.0}
  - {band: "93", min: 90.0, max: 97.0}
  - {band: "101", min: 97.0, max: 107.0}
  - {band: "118", min: 112.0, max: 125.0}

# 검증: 이상치 = 같은 단지·평형 ±1개월(3개월 창) 중앙값 대비 편차가 기준 이상
validate:
  outlier_pct: 15
  outlier_min_n: 3

# 네이버 매물 스냅샷 지표 (2026-09-28 첫 실제 덤프로 확정). endpoint = 북마클릿 응답 키,
# paths = 평탄화한 JSON 경로 정규식 후보(먼저 맞는 것). 값 단위: 건수 / 원.
listing_metrics:
  sale_count:    {endpoint: article_stats, paths: ['^result\.count\.dealCount$']}            # 매매 매물 수
  lease_count:   {endpoint: article_stats, paths: ['^result\.count\.leaseDepositCount$']}    # 전세 매물 수
  wolse_count:   {endpoint: article_stats, paths: ['^result\.count\.leaseMonthlyCount$']}    # 월세 매물 수
  sale_min_ask:  {endpoint: article_stats, paths: ['^result\.price\.dealMinPrice$']}         # 매매 최저 호가(원)
  sale_max_ask:  {endpoint: article_stats, paths: ['^result\.price\.dealMaxPrice$']}
  lease_min_ask: {endpoint: article_stats, paths: ['^result\.price\.rentMinPrice$']}         # 전세 최저 호가(원)
  lease_max_ask: {endpoint: article_stats, paths: ['^result\.price\.rentMaxPrice$']}
  # 평형별 호가(asking_price, pyeongTypeNumber별)는 2차 덤프에서 구조 확인 후 추가
