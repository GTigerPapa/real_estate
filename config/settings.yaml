# 수집 대상 시군구 (응답 sggCd로 확인)
lawd_codes:
  "11740": 서울 강동구
  "41133": 성남시 중원구
  "41450": 하남시
  "41135": 성남시 분당구

backfill_start: "202310"      # 백필 시작월 (YYYYMM)
refetch_recent_months: 3      # 현재월 포함 최근 N개월은 완료 여부와 무관하게 매번 재수집

api:
  num_of_rows: 1000
  request_interval_sec: 0.3   # 호출 간 최소 간격
  timeout_sec: 30
  max_retries: 4              # 지수 백오프: 1, 2, 4, 8초 (+지터)
  backoff_base_sec: 1.0

buy_cap_manwon: 140000        # 매수 상한 (만원) = 14억

# 평형 구간 (전용면적 ㎡, [min, max)). 확정: 2023-10~2026-09 관심 단지 실거래 분포 기준
#   59: 실제 59.71~59.99 / 74: 73.03~74.99 / 84: 84.04~84.99
# 84형 위 대형 (2026-09-29 추가, 실거래·전월세 면적 기준)
#   93: 미사더샵 93.06~93.36 / 101: 고덕자이 101.04·101.99, 고덕아이파크 102.85, 미사더샵 101.82, 장미8단지 101
#   118: 고덕자이 118.45 (고덕아이파크 120.37은 전월세만 있어 단지 평형에는 넣지 않음)
size_bands:
  - {band: "59", min: 57.0, max: 62.0}
  - {band: "74", min: 72.0, max: 77.0}
  - {band: "84", min: 82.0, max: 87.0}
  - {band: "93", min: 90.0, max: 97.0}
  - {band: "101", min: 97.0, max: 107.0}
  - {band: "118", min: 112.0, max: 125.0}

# 검증: 이상치 = 같은 단지·평형 ±1개월(3개월 창) 중앙값 대비 편차가 기준 이상
validate:
  outlier_pct: 15
  outlier_min_n: 3

# 네이버 매물 스냅샷 지표 (2026-09-28 첫 실제 덤프로 확정). endpoint = 북마클릿 응답 키,
# paths = 평탄화한 JSON 경로 정규식 후보(먼저 맞는 것). 값 단위: 건수 / 원.
listing_metrics:
  sale_count:    {endpoint: article_stats, paths: ['^result\.count\.dealCount$']}            # 매매 매물 수
  lease_count:   {endpoint: article_stats, paths: ['^result\.count\.leaseDepositCount$']}    # 전세 매물 수
  wolse_count:   {endpoint: article_stats, paths: ['^result\.count\.leaseMonthlyCount$']}    # 월세 매물 수
  sale_min_ask:  {endpoint: article_stats, paths: ['^result\.price\.dealMinPrice$']}         # 매매 최저 호가(원)
  sale_max_ask:  {endpoint: article_stats, paths: ['^result\.price\.dealMaxPrice$']}
  lease_min_ask: {endpoint: article_stats, paths: ['^result\.price\.rentMinPrice$']}         # 전세 최저 호가(원)
  lease_max_ask: {endpoint: article_stats, paths: ['^result\.price\.rentMaxPrice$']}
  # 평형별 호가(asking_price, pyeongTypeNumber별)는 2차 덤프에서 구조 확인 후 추가

# 매물×가격 분석 지역 (2026-09-30). asil_area = 아실 지역 코드(시군구 5자리 / 법정동 10자리),
# 가격은 같은 지역의 전체 아파트 매매 실거래(해제 제외)로 계산 — 시군구는 sgg_cd 전체, 동은 sgg_cd + umd_nm.
regions:
  - {id: gangdong,  name: 강동구,        short: 강동구, asil_area: "11740",      sgg_cd: "11740"}
  - {id: sangil,    name: 강동구 상일동, short: 상일동, asil_area: "1174010300", sgg_cd: "11740", umd_nm: 상일동}
  - {id: bundang,   name: 성남 분당구,   short: 분당구, asil_area: "41135",      sgg_cd: "41135"}
  - {id: yatap,     name: 분당구 야탑동, short: 야탑동, asil_area: "4113510700", sgg_cd: "41135", umd_nm: 야탑동}
  - {id: jungwon,   name: 성남 중원구,   short: 중원구, asil_area: "41133",      sgg_cd: "41133"}
  - {id: yeosu,     name: 중원구 여수동, short: 여수동, asil_area: "4113310600", sgg_cd: "41133", umd_nm: 여수동}
  - {id: hanam,     name: 하남시,        short: 하남시, asil_area: "41450",      sgg_cd: "41450"}
  - {id: pungsan,   name: 하남 풍산동,   short: 풍산동, asil_area: "4145011000", sgg_cd: "41450", umd_nm: 풍산동}

# 한국은행 ECOS 지표 (2026-10-04). 키 = 환경변수 ECOS_KEY (GitHub Secrets·.env). 월별, 2013-01부터.
# item2 는 2단계 항목 코드(없으면 생략). ytd: true 면 ECOS 값이 연중 누계라 월별로 풀어서 쓴다
ecos:
  start: "201301"
  series:
    - {id: base_rate,   name: 기준금리,             group: rate,   stat: 722Y001, item: "0101000", unit: "%"}
    - {id: mort_rate,   name: 주택담보대출 금리(신규), group: rate,  stat: 121Y006, item: BECBLA0302, unit: "%"}
    - {id: ktb3,        name: 국고채 3년,           group: rate,   stat: 721Y001, item: "5020000", unit: "%"}
    - {id: csi_house,   name: 주택가격전망CSI,      group: mood,   stat: 511Y002, item: FMFB, item2: "99988", unit: ""}
    - {id: csi_rate,    name: 금리수준전망CSI,      group: mood,   stat: 511Y002, item: FMBG, item2: "99988", unit: ""}
    - {id: kb_seoul_apt,     name: KB 서울 아파트 매매지수, group: price, stat: 901Y062, item: P63ACA, unit: ""}
    - {id: kb_seoul_apt_jeonse, name: KB 서울 아파트 전세지수, group: price, stat: 901Y063, item: P64ACA, unit: ""}
    - {id: house_loan,  name: 주택관련대출 잔액(예금취급기관), group: credit, stat: 151Y005, item: 11100A0, unit: "십억원"}
    - {id: unsold_capital, name: 미분양 주택(수도권), group: supply, stat: 901Y074, item: I410R, unit: "호"}
    - {id: permit_seoul,   name: 주택 인허가(서울),   group: supply, stat: 901Y105, item: SEO, unit: "호", ytd: true}   # 연중 누계값
    - {id: permit_gyeonggi, name: 주택 인허가(경기),  group: supply, stat: 901Y105, item: GYE, unit: "호", ytd: true}

# 심리 (2026-10-04). 키: NAVER_CLIENT_ID/SECRET (NAVER API HUB), YOUTUBE_API_KEY. GitHub Actions 가 매일 수집.
sentiment:
  datalab_start: "2016-01-01"
  # 데이터랩은 한 요청 안에서만 비교 가능(최댓값=100) → '상승·하락'은 같은 요청(비율 = 탐욕/공포), 나머지는 묶음별 요청
  ratio_pair: [up, down]
  groups:
    up:   {name: 상승 기대, keywords: [집값 상승, 집값 폭등, 아파트값 상승, 집값 오른다, 부동산 막차]}
    down: {name: 하락 기대, keywords: [집값 하락, 집값 폭락, 아파트값 하락, 부동산 거품, 하락장]}
    buy:  {name: 매수 행동, keywords: [갭투자, 영끌, 내집마련, 주담대, 아파트 매수]}
    sell: {name: 매도·급매, keywords: [급매, 급매물, 매물 증가, 손절, 세안고]}
    area: {name: 관심 지역, keywords: [고덕 아파트, 미사 아파트, 분당 아파트, 고덕자이, 미사강변]}
  # 하루 새 글 수 = 오늘 검색 결과 총수 − 어제 총수 (네이버 검색 API는 날짜별 건수를 주지 않음)
  counts:
    - {id: cafe_sell,   source: cafe, query: 급매}
    - {id: cafe_seango, source: cafe, query: 세안고}
    - {id: cafe_crash,  source: cafe, query: 집값 폭락}
    - {id: cafe_surge,  source: cafe, query: 집값 폭등}
    - {id: news_policy, source: news, query: 부동산 대책}
    - {id: news_rate,   source: news, query: 주담대 금리}
    - {id: news_house,  source: news, query: 집값}
  feed:
    news:
      - {tag: 정책,   query: 부동산 대책}
      - {tag: 금리,   query: 주담대 금리}
      - {tag: 급매,   query: 아파트 급매}
      - {tag: 토허제, query: 토지거래허가 아파트}
      - {tag: 강동,   query: 강동구 아파트}
      - {tag: 분당,   query: 분당 아파트}
      - {tag: 하남,   query: 하남 미사 아파트}
    cafe:
      - {tag: 고덕,   query: 고덕 아파트}
      - {tag: 미사,   query: 미사 아파트}
      - {tag: 분당,   query: 분당 야탑 아파트}
      - {tag: 세안고, query: 세안고 매매}
      - {tag: 급매,   query: 아파트 급매}
    per_topic: 3
    max_items: 12
    news_hours: 48
    ad_words: [분양, 모델하우스, 홍보관, 상담, 문의, 특별공급, 선착순, 무료, 이벤트, 오픈, 견본주택]
  youtube:
    query: "부동산|아파트|집값"
    top: 5
