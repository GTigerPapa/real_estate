# 관심 단지 매칭 (확정: 실거래 데이터 확인 후 사용자 승인)
# 매칭: apt_seq 우선, 보조로 (umd_nm, jibun, apt_nm) — 전월세 등 aptSeq 누락 대비
# naver_id: 네이버페이 부동산 단지번호 (지도 URL layer 파라미터에서 확인, 2026-09) = 아실 일별 매물 수(asil.py)의 단지 번호
# asil_id: 아실 단지 번호 (매물 목록용, 아실 검색 결과의 seq, 2026-09)
# fallback 의 apt_nm 을 비우면 법정동+지번만으로 매칭한다 (실거래 단지명 표기를 아직 모를 때)
# 순서 = 앱 표시 순서 (2026-10-10 사용자 지정)
# group = 지역(성남/하남/서울) — 비교 차트는 지역별 패널로 나눠 그린다
# color = 단지 색 (라이트/다크). 같은 지역은 비슷한 색 계열(성남 붉은 계열·하남 초록 계열·서울 파랑 계열, 2026-10-10 사용자 지정), 패널 안에서는 서로 구별되게
#   dataviz validate_palette 로 지역별(패널 단위) 검증. 단지를 추가하면 같은 계열에서 골라 다시 검증할 것
